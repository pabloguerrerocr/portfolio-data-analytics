# Baja los indicadores económicos (Banco Mundial y FMI) y guarda el CSV en
# el repositorio. Corre el día 5 de cada mes, a mano desde la pestaña
# Actions, y cuando cambia el script de descarga.
name: Datos económicos

on:
  schedule:
    - cron: "17 6 5 * *"
  workflow_dispatch:
  push:
    paths:
      - "poblacion-mundial/datos_economicos.py"
      - ".github/workflows/datos-economicos.yml"

permissions:
  contents: write

concurrency:
  group: datos-economicos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Preparar población (verificaciones incluidas)
        run: python poblacion-mundial/preparar_datos.py

      - name: Bajar indicadores económicos
        run: python poblacion-mundial/datos_economicos.py

      - name: Guardar si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f poblacion-mundial/datos/economia.csv
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
          else
            git commit -m "Actualizar indicadores económicos ($(date -u +%Y-%m-%d))"
            git push
          fi
